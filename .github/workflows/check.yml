name: Check skill and library
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  library:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["20", "22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts
      - run: node --test tests/library.test.mjs tests/package.test.mjs
      - run: node skills/game-ui-frontend/scripts/library.mjs check
  browser:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test --test-concurrency=1 tests/browser.test.mjs
