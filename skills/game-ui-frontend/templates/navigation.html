<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigation archetypes</title>
<link rel="stylesheet" href="tokens.css">
<style>
/* Left-column menu with a travelling side marker */
.stage {
  position: relative;
  display: grid;
  grid-template-columns: minmax(220px, 320px) 1fr;
  min-height: 460px;
  overflow: hidden;                         /* the scene is cropped, the menu is not */
  background:
    linear-gradient(90deg, var(--c-scene) 0 28%, transparent 70%),
    radial-gradient(60% 90% at 75% 40%, #3a2a5c, var(--c-scene-2) 70%);
}
.stage::after {
  content: "";
  grid-column: 2;
  grid-row: 1;
  place-self: center;
  width: min(67%, 18rem);
  aspect-ratio: 1;
  border: 1px solid #7b748c;
  border-radius: 50%;
  background:
    radial-gradient(circle, var(--c-scene) 0 2.3%, #ad7788 2.6% 12%, transparent 12.4%),
    repeating-radial-gradient(circle, transparent 0 7px, #d3cbec22 8px, transparent 9px),
    conic-gradient(from -25deg, #1b2140, #69516b 27%, #202a4a 40%, #17203a 68%, #62506a 91%, #1b2140);
  pointer-events: none;
}
.menu {
  position: relative;
  z-index: var(--z-label);
  align-self: center;
  padding: var(--space-6) var(--space-6) var(--space-6) var(--space-7);
}
.menu ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-2); }
.menu__link {
  position: relative;
  display: flex;
  align-items: center;
  min-height: 48px;
  padding: 0 var(--space-4);
  border: 1px solid #69748b;
  border-radius: 2px 12px;
  background: #232d44;
  color: var(--c-ink);
  text-decoration: none;
  font: 700 var(--step-1)/1 var(--font-display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  transition: color var(--t-exit) linear;
}
/* Move the label, never the link: shifting the hit area under a still pointer causes hover flicker. */
.menu__label { display: inline-block; transition: translate var(--t-exit) var(--ease-exit); }
.menu__link:is(:hover, :focus-visible) {
  background: #303d56;
  border-color: var(--c-accent);
}
.menu__link:is(:hover, :focus-visible) .menu__label, .menu__link[aria-current="page"] .menu__label {
  translate: 6px 0;
  transition: translate var(--t-enter) var(--ease-enter);
}
.menu__link[aria-current="page"] {
  background: var(--c-accent);
  color: var(--c-accent-ink);
  border-color: var(--c-accent);
  box-shadow: inset 4px 0 var(--c-accent-ink);
}
.menu__link[aria-current="page"]:is(:hover, :focus-visible) { background: #ffe695; }
/* The marker is one element for the whole menu. It travels to the item under intent and returns to the
   current page when intent leaves, so the selection reads as a separate actor, not a per-row highlight. */
.menu__marker {
  position: absolute;
  left: var(--space-5);
  top: 0;
  width: 8px;
  height: 22px;
  background: var(--c-signal);
  border-radius: 3px 0;
  pointer-events: none;
  translate: 0 var(--marker-y, 0px);
  transition: translate var(--t-enter) var(--ease-enter);
}
.menu-toggle { display: none; }

/* Slanted tab plates (ARIA tabs) */
.tabs__list {
  position: relative;
  display: flex;
  gap: var(--space-2);
  padding: var(--space-2);
  flex-wrap: wrap;
}
.tabs__tab {
  position: relative;
  isolation: isolate;
  flex: none;
  min-height: var(--target-min);
  padding: 0 var(--space-5);
  border: 0;
  background: none;
  color: var(--c-ink-muted);
  font: 700 var(--step-0)/1 var(--font-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  cursor: pointer;
}
.tabs__tab::before {
  content: "";
  position: absolute;
  inset: 4px 0;
  z-index: -1;
  pointer-events: none;
  border: 1px solid #69748b;
  background: #232d44;
  transform: skewX(var(--angle));
  transition: background-color var(--t-exit) linear;
}
.tabs__tab[aria-selected="true"] { color: var(--c-accent-ink); }
.tabs__tab[aria-selected="true"]::before { border-color: var(--c-accent); background: var(--c-accent); box-shadow: inset 4px 0 var(--c-accent-ink); transition: background-color var(--t-enter) linear; }
.tabs__tab:is(:hover, :focus-visible) { color: var(--c-accent-ink); }
.tabs__tab:is(:hover, :focus-visible)::before { border-color: var(--c-ink); background: #b9cbea; }
.tabs__tab[aria-selected="true"]:is(:hover, :focus-visible)::before { background: #ffe695; }
.tabs__tab:focus-visible { outline-offset: 2px; }
.tabs__panel { padding: var(--space-5) var(--space-2); max-width: 60ch; }
.tabs__panel[hidden] { display: none; }

@media (prefers-reduced-motion: reduce) {
  .menu__link .menu__label { translate: 0 0 !important; }
}

/* ---------- narrow screens: the menu becomes a full-screen overlay with the same marker and type ---------- */
@media (max-width: 719px) {
  .stage { grid-template-columns: 1fr; min-height: 360px; }
  .stage::after { grid-column: 1; width: min(67%, 14rem); }
  .menu-toggle {
    display: inline-flex;
    position: absolute;
    top: var(--space-4);
    right: var(--space-4);
    z-index: var(--z-action);
    align-items: center;
    gap: var(--space-2);
    min-height: var(--target-min);
    padding: 0 var(--space-4);
    border: 2px solid var(--c-accent);
    background: var(--c-scene);
    color: var(--c-ink);
    font: 700 var(--step-0)/1 var(--font-display);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .menu-toggle:hover { background: color-mix(in srgb, var(--c-accent) 20%, var(--c-scene)); }
  .menu-toggle:active { background: var(--c-accent); color: var(--c-accent-ink); }
  .menu {
    position: absolute;
    inset: 0;
    padding: var(--space-8) var(--space-5) var(--space-5) var(--space-6);
    background: color-mix(in srgb, var(--c-scene) 94%, transparent);
    visibility: hidden;
    opacity: 0;
    transition: opacity var(--t-exit) linear, visibility 0s linear var(--t-exit);
  }
  .stage[data-open="true"] .menu { visibility: visible; opacity: 1; transition: opacity var(--t-enter) linear; }
  .menu__marker { left: var(--space-3); }
  .tabs__tab { padding-inline: var(--space-3); }
}
</style>
</head>
<body>
<main class="demo-page">
  <h1 class="visually-hidden">Navigation archetypes</h1>

  <section class="demo-section" aria-label="Studio menu">
    <div class="stage" id="stage">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">Menu</button>
      <nav class="menu" id="site-menu" aria-label="Site">
        <span class="menu__marker" aria-hidden="true"></span>
        <ul>
          <li><a class="menu__link" href="#work" aria-current="page"><span class="menu__label">Work</span></a></li>
          <li><a class="menu__link" href="#process"><span class="menu__label">Process</span></a></li>
          <li><a class="menu__link" href="#studio"><span class="menu__label">Studio</span></a></li>
          <li><a class="menu__link" href="#journal"><span class="menu__label">Journal</span></a></li>
          <li><a class="menu__link" href="#contact"><span class="menu__label">Contact</span></a></li>
        </ul>
      </nav>
    </div>
  </section>

  <section class="demo-section" aria-label="Case study">
    <div class="tabs">
      <div class="tabs__list" role="tablist" aria-label="Case study sections">
        <button class="tabs__tab" role="tab" id="t-brief" aria-selected="true" aria-controls="p-brief">Brief</button>
        <button class="tabs__tab" role="tab" id="t-process" aria-selected="false" aria-controls="p-process" tabindex="-1">Process</button>
        <button class="tabs__tab" role="tab" id="t-outcome" aria-selected="false" aria-controls="p-outcome" tabindex="-1">Outcome</button>
        <button class="tabs__tab" role="tab" id="t-credits" aria-selected="false" aria-controls="p-credits" tabindex="-1">Credits</button>
      </div>
      <div class="tabs__panel" role="tabpanel" id="p-brief" aria-labelledby="t-brief" tabindex="0">What the client needed and why it was hard.</div>
      <div class="tabs__panel" role="tabpanel" id="p-process" aria-labelledby="t-process" tabindex="0" hidden>How the work moved from sketches to production.</div>
      <div class="tabs__panel" role="tabpanel" id="p-outcome" aria-labelledby="t-outcome" tabindex="0" hidden>What changed after launch.</div>
      <div class="tabs__panel" role="tabpanel" id="p-credits" aria-labelledby="t-credits" tabindex="0" hidden>Who made it.</div>
    </div>
  </section>
</main>

<script>
// Travelling marker: follows pointer/focus intent, rests on the current page otherwise.
(function menuMarker(menu) {
  const marker = menu.querySelector(".menu__marker");
  const links = [...menu.querySelectorAll(".menu__link")];
  const current = () => menu.querySelector('[aria-current="page"]') ?? links[0];
  function moveTo(link) {
    // Links are positioned, so offsetTop is already measured from the menu.
    const y = link.offsetTop + (link.offsetHeight - marker.offsetHeight) / 2;
    menu.style.setProperty("--marker-y", `${y}px`);
  }
  for (const link of links) {
    link.addEventListener("pointerenter", () => moveTo(link));
    link.addEventListener("focus", () => moveTo(link));
    link.addEventListener("click", () => {
      links.forEach((l) => l.removeAttribute("aria-current"));
      link.setAttribute("aria-current", "page");
    });
  }
  menu.addEventListener("pointerleave", () => { if (!menu.contains(document.activeElement)) moveTo(current()); });
  menu.addEventListener("focusout", (e) => { if (!menu.contains(e.relatedTarget)) moveTo(current()); });
  new ResizeObserver(() => moveTo(current())).observe(menu);
})(document.getElementById("site-menu"));

// Overlay menu on narrow screens.
(function overlay(stage) {
  const toggle = stage.querySelector(".menu-toggle");
  const menu = stage.querySelector(".menu");
  function set(open) {
    stage.dataset.open = String(open);
    toggle.setAttribute("aria-expanded", String(open));
    toggle.textContent = open ? "Close" : "Menu";
    if (open) menu.querySelector(".menu__link")?.focus();
  }
  toggle.addEventListener("click", () => set(stage.dataset.open !== "true"));
  stage.addEventListener("keydown", (e) => { if (e.key === "Escape" && stage.dataset.open === "true") { set(false); toggle.focus(); } });
})(document.getElementById("stage"));

// ARIA tabs with roving tabindex.
(function tabs(list) {
  const tabs = [...list.querySelectorAll('[role="tab"]')];
  function select(tab, focus = true) {
    for (const t of tabs) {
      const on = t === tab;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
    }
    if (focus) tab.focus();
  }
  list.addEventListener("click", (e) => { const t = e.target.closest('[role="tab"]'); if (t) select(t); });
  list.addEventListener("keydown", (e) => {
    const i = tabs.indexOf(document.activeElement);
    if (i < 0) return;
    const next = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: tabs.length - 1 }[e.key];
    if (next === undefined) return;
    e.preventDefault();
    select(tabs[(next + tabs.length) % tabs.length]);
  });
})(document.querySelector('[role="tablist"]'));
</script>
</body>
</html>
