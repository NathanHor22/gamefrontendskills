<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Index and preview</title>
<link rel="stylesheet" href="tokens.css">
<style>
/*
  Character-select anatomy for a project/product index:
    stage   - large project artwork beside its title and credits
    roster  - compact, stable grid of native radio inputs (arrow keys for free)
    marker  - a red tab follows the preview; a gold frame marks the committed project
*/
.select {
  display: grid;
  grid-template-columns: 1fr minmax(240px, 320px);
  grid-template-areas: "stage detail" "roster roster";
  gap: var(--space-5) var(--space-6);
}

/* ---------- stage ---------- */
.stage {
  grid-area: stage;
  position: relative;
  isolation: isolate;
  min-height: 380px;
  display: grid;
  place-items: end center;
  overflow: visible;
}
.stage__frame {
  position: absolute;
  inset: 18% 6% 0;
  z-index: -2;
  background: linear-gradient(160deg, var(--tone, #3a2a5c), var(--c-scene-2));
  clip-path: polygon(0 var(--cut), var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%);
  transition: background var(--t-exit) linear;
}
/* The subject is drawn art that rises far above its frame: the drama of the screen. */
.stage__subject {
  width: min(340px, 70%);
  aspect-ratio: 3 / 4;
  margin-bottom: 0;
  pointer-events: none;
}
.stage__subject svg { width: 100%; height: 100%; overflow: visible; }

/* ---------- detail shelf ---------- */
.detail {
  grid-area: detail;
  align-self: end;
  padding: var(--space-5);
  background: var(--c-plate);
}
.detail h2 { margin: 0 0 var(--space-1); font: 800 var(--step-3)/1 var(--font-display); text-transform: uppercase; }
.detail__meta { display: grid; grid-template-columns: auto 1fr; gap: var(--space-1) var(--space-4); margin: var(--space-4) 0; }
.detail__meta dt { color: var(--c-ink-muted); text-transform: uppercase; letter-spacing: 0.08em; }
.detail__meta dd { margin: 0; }
.detail summary {
  display: inline-flex;
  align-items: center;
  gap: var(--space-3);
  width: fit-content;
  min-height: var(--target-min);
  max-width: 100%;
  padding: var(--space-2) var(--space-4);
  border: 1px solid var(--c-accent);
  background: var(--c-scene-2);
  color: var(--c-ink);
  font: italic 800 var(--step-1)/1.2 var(--font-display);
  list-style: none;
  cursor: pointer;
}
.detail summary::-webkit-details-marker { display: none; }
.detail summary::before {
  content: "";
  flex: 0 0 14px;
  height: 14px;
  background: linear-gradient(currentColor, currentColor) center / 100% 2px no-repeat,
              linear-gradient(currentColor, currentColor) center / 2px 100% no-repeat;
}
.detail details[open] summary::before { background-size: 100% 2px, 0 0; }
.detail summary:is(:hover, :focus-visible), .detail details[open] summary {
  color: var(--c-accent-ink);
  background: var(--c-accent);
}
.detail summary:active { background: var(--c-ink); }

/* ---------- roster ---------- */
.roster { grid-area: roster; border: 0; margin: 0; padding: 0; min-width: 0; }
.roster__grid {
  position: relative;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
  gap: var(--seam);
}
.cell { position: relative; }
.cell input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.cell label {
  position: relative;
  isolation: isolate;
  display: grid;
  align-content: end;
  min-height: 88px;
  padding: var(--space-2) var(--space-4);
  color: var(--c-ink);
  font: 700 var(--step-0)/1.1 var(--font-display);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  filter: saturate(0.55) brightness(0.8);
  transition: filter var(--t-exit) linear;
}
.cell label::before {
  content: "";
  position: absolute;
  z-index: -1;
  inset: 0 6px;
  transform: skewX(-6deg);
  background: linear-gradient(170deg, var(--tone), var(--c-scene) 85%);
  border: 1px solid #76809a;
  pointer-events: none;
}
.cell label:hover, .cell input:focus-visible + label, .cell input:checked + label {
  filter: none;
  transition: filter var(--t-enter) linear;
}
.cell:has(input:focus-visible) { outline: 3px solid var(--c-focus); outline-offset: 3px; }
.cell input:disabled + label { cursor: not-allowed; filter: grayscale(1) brightness(0.55); }
.cell input:checked + label::before { border: 3px solid var(--c-accent); }
.cell__icon { width: 32px; height: 34px; margin-bottom: 6px; stroke: currentColor; fill: none; stroke-width: 5; pointer-events: none; }
.cell input:disabled + label::after {
  content: "";
  position: absolute;
  top: 10px;
  right: 14px;
  width: 14px;
  height: 18px;
  background: var(--c-ink-muted);
  clip-path: polygon(20% 40%, 20% 20%, 35% 5%, 65% 5%, 80% 20%, 80% 40%, 100% 40%, 100% 100%, 0 100%, 0 40%, 30% 40%, 30% 25%, 40% 15%, 60% 15%, 70% 25%, 70% 40%);
}
.roster__marker {
  position: absolute;
  top: 0;
  left: 0;
  z-index: 1;
  width: 22px;
  height: 8px;
  margin: 7px 0 0 14px;
  transform: skewX(-6deg);
  background: var(--c-signal);
  translate: var(--mx, 0px) var(--my, 0px);
  transition: translate var(--t-enter) var(--ease-enter);
  pointer-events: none;
}

@media (max-width: 719px) {
  .select { grid-template-columns: minmax(0, 1fr); grid-template-areas: "stage" "roster" "detail"; }
  .stage { min-height: 300px; }
  .roster__grid { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 104px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 18px 4px 6px; }
  .cell { scroll-snap-align: start; }
}
</style>
</head>
<body>
<main class="demo-page">
  <h1 id="s1">Selected work</h1>
  <section class="demo-section" aria-labelledby="s1">

    <div class="select" id="select">
      <div class="stage" aria-hidden="true">
        <div class="stage__frame"></div>
        <div class="stage__subject"></div>
      </div>

      <fieldset class="roster">
        <legend class="visually-hidden">Choose a project</legend>
        <div class="roster__grid">
          <span class="roster__marker" aria-hidden="true"></span>
        </div>
      </fieldset>
      <div class="detail">
        <h2 id="detail-title"></h2>
        <p id="detail-summary"></p>
        <details id="project-details">
          <summary>Project credits</summary>
          <dl class="detail__meta">
            <dt>Year</dt><dd id="detail-year"></dd>
            <dt>Role</dt><dd id="detail-role"></dd>
          </dl>
        </details>
      </div>
      <p class="visually-hidden" role="status" id="announce"></p>
    </div>
  </section>
</main>

<script>
const projects = [
  { id: "atlas", name: "Atlas", year: 2026, role: "Art direction", tone: "#3a2a5c", summary: "A route atlas for a touring exhibition.", shape: "M50 6 92 30 92 78 50 102 8 78 8 30Z" },
  { id: "relay", name: "Relay", year: 2025, role: "Design & build", tone: "#123d4f", summary: "Live race telemetry for a cycling team.", shape: "M8 63H26L37 37L50 84L66 24L76 63H92" },
  { id: "ledger", name: "Ledger", year: 2025, role: "Interface design", tone: "#4a2a1a", summary: "A night-shift accounting tool with stamps.", shape: "M14 10H86V96H14ZM28 26H72M28 44H72M28 62H58" },
  { id: "signal", name: "Signal", year: 2024, role: "Motion", tone: "#1d3b2a", summary: "Identity system for a radio festival.", shape: "M50 54m-40 0a40 40 0 1 0 80 0a40 40 0 1 0 -80 0M50 54m-18 0a18 18 0 1 0 36 0a18 18 0 1 0 -36 0" },
  { id: "kiln", name: "Kiln", year: 2023, role: "Art direction", tone: "#5a1f2a", summary: "Ceramics studio shop and archive.", shape: "M20 100 30 20H70L80 100ZM30 20 50 4 70 20" },
  { id: "vault", name: "Vault", year: 2027, role: "Coming soon", tone: "#2b2b33", summary: "Not yet public.", shape: "M50 54m-30 0a30 30 0 1 0 60 0a30 30 0 1 0 -60 0", locked: true },
];

(function indexSelect(root) {
  const grid = root.querySelector(".roster__grid");
  const stage = root.querySelector(".stage");
  const subject = stage.querySelector(".stage__subject");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  let committed = projects[0];
  let shown = null;

  for (const [i, p] of projects.entries()) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.setProperty("--tone", p.tone);
    cell.innerHTML = `<input type="radio" name="project" id="p-${p.id}" value="${p.id}" ${i === 0 ? "checked" : ""} ${p.locked ? "disabled" : ""}>
      <label for="p-${p.id}"><svg class="cell__icon" aria-hidden="true" viewBox="0 0 100 108"><path d="${p.shape}"/></svg>
        ${p.name}${p.locked ? '<span class="visually-hidden"> (locked)</span>' : ""}</label>`;
    grid.append(cell);
    cell.addEventListener("pointerenter", (event) => {
      if (event.pointerType !== "touch") show(p, cell);
    });
    cell.querySelector("input").addEventListener("change", () => {
      committed = p;
      show(p, cell);
      // Announce commits only; hover previews would be noise for screen-reader users.
      document.getElementById("announce").textContent = p.summary;
    });
    cell.querySelector("input").addEventListener("focus", () => show(p, cell));
  }
  grid.addEventListener("pointerleave", () => show(committed, cellOf(committed)));
  const cellOf = (p) => grid.querySelector(`#p-${p.id}`).parentElement;

  // Swaps start from whatever is on screen now, so rapid changes redirect instead of queueing.
  function swapIn(el, enterFrom) {
    const from = getComputedStyle(el);
    const running = el.getAnimations();
    const start = running.length ? { opacity: from.opacity, translate: from.translate } : enterFrom;
    running.forEach((a) => a.cancel());
    if (reduce.matches) return;
    el.animate([start, { opacity: 1, translate: "0 0" }],
      { duration: 260, easing: "cubic-bezier(0.2, 0.9, 0.1, 1.1)" });
  }

  function show(p, cell) {
    grid.style.setProperty("--mx", `${cell.offsetLeft}px`);
    grid.style.setProperty("--my", `${cell.offsetTop}px`);
    if (shown === p) return;
    shown = p;
    stage.style.setProperty("--tone", p.tone);
    subject.innerHTML = `<svg viewBox="0 0 100 108" role="presentation"><path d="${p.shape}" fill="none" stroke="#f4f1ea" stroke-width="3" stroke-linejoin="round"/></svg>`;
    swapIn(subject, { opacity: 0, translate: "0 28px" });
    document.getElementById("detail-title").textContent = p.name;
    document.getElementById("detail-summary").textContent = p.summary;
    document.getElementById("detail-year").textContent = p.year;
    document.getElementById("detail-role").textContent = p.role;
    document.getElementById("project-details").hidden = Boolean(p.locked);
  }

  new ResizeObserver(() => show(shown ?? committed, cellOf(shown ?? committed))).observe(grid);
  show(committed, cellOf(committed));
})(document.getElementById("select"));
</script>
</body>
</html>
